      saveManualBulkContributors(e) {
        e.preventDefault();
        const month = Number(document.getElementById('bc-mon').value);
        const year = Number(document.getElementById('bc-yr').value);
        const receiptDate = document.getElementById('bc-date').value;
        const fy = Utils.getFY(year, month);
        const trs = Array.from(document.querySelectorAll('#bulk-contrib-tbody tr'));
        let saved = 0;

        trs.forEach(tr => {
          const name = tr.querySelector('[name="bc_name"]').value.trim();
          const sec = tr.querySelector('[name="bc_sec"]').value.trim() || 'RB-GEN';
          const dte = tr.querySelector('[name="bc_dte"]').value.trim() || 'Railway Board Dte.';
          const amt = Number(tr.querySelector('[name="bc_amt"]').value || 0);
          const mode = tr.querySelector('[name="bc_mode"]').value;
          const ref = tr.querySelector('[name="bc_ref"]').value.trim();
          if (!name || amt <= 0) return;

          const matchedEmp = Store.data.employees.find(x => x.fullName.toLowerCase() === name.toLowerCase());
          const sectionIdSnapshot = matchedEmp ? matchedEmp.sectionId : Store.findOrCreateSection(sec, dte);

          Store.data.contributions.unshift({
            id: Utils.nextId(Store.data.contributions),
            financialYear: fy,
            year,
            month,
            employeeId: matchedEmp ? matchedEmp.id : null,
            employeeNameSnapshot: name,
            sectionIdSnapshot,
            directorateSnapshot: dte,
            amountReceived: amt,
            receiptDate,
            paymentMode: mode,
            reference: ref,
            status: 'Active'
          });
          saved++;
        });

        if (!saved) {
          Toast.show('Please enter at least one contributor with Name and Amount.', 'error');
          return;
        }
        Store.save();
        Store.logAudit('Contribution', 'Manual Bulk Feed', `Recorded ${saved} contributor entries for ${MONTHS[month - 1]} ${year}.`);
        Modal.close();
        Toast.show(`Recorded ${saved} contributor(s) into the Collection Register!`, 'success');
        this.navigate('collections');
      },

      async processContributorPdf(input) {
        const file = input.files?.[0];
        if (!file) return;
        const statusEl = document.getElementById('contrib-pdf-status');
        statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5 text-navy-800"></i>Extracting contributor entries from <strong>${Utils.escapeHtml(file.name)}</strong>...`;
        try {
          const lines = await PdfExtractor.extractFromFile(file);
          const extracted = PdfExtractor.parseContributorRows(lines);
          Store.logAudit('PDF Extract', 'Contributors PDF', `Extracted ${extracted.length} contributor rows from ${file.name}.`);
          Toast.show(`Extracted ${extracted.length} contributor row(s) from PDF.`, 'success');
          this.openManualBulkContributorsModal(extracted.length ? extracted : [{ name: '', section: '', directorate: '', amount: 10, mode: 'UPI', reference: '' }]);
        } catch (err) {
          statusEl.innerHTML = `<span class="text-rose-700 font-semibold">${Utils.escapeHtml(err.message || 'Could not parse PDF.')}</span>`;
        }
      },

                <input id="pi-qty" type="number" step="0.01" min="0.1" value="1" oninput="AdminApp.recalcPurchasePreview()" required placeholder="Qty" class="px-3 py-2 rounded-xl border border-slate-300 text-xs" />
                <input id="pi-price" type="number" step="0.01" min="0" value="0" oninput="AdminApp.recalcPurchasePreview()" required placeholder="Unit Price" class="px-3 py-2 rounded-xl border border-slate-300 text-xs" />
              </div>
              <div class="mt-2 flex items-center justify-between text-xs">
                <input id="pi-unit" value="Pcs" placeholder="Unit (Kg/Pcs/Lot)" class="w-32 px-3 py-1.5 rounded-lg border border-slate-300 text-xs" />
                <span class="font-bold text-navy-900">Calculated Total: <strong id="pi-total" class="text-rose-700 text-sm">₹0.00</strong></span>
              </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="Modal.close()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button>

            </div>
          </form>

      },

      recalcPurchasePreview() {
        const q = Number(document.getElementById('pi-qty')?.value || 0);
        const p = Number(document.getElementById('pi-price')?.value || 0);
        const el = document.getElementById('pi-total');
        if (el) el.textContent = Utils.formatCurrency(q * p);
      },

      savePurchase(e) {
        e.preventDefault();
        const dt = document.getElementById('pf-date').value;
        const [y, m] = dt.split('-').map(Number);
        const qty = Number(document.getElementById('pi-qty').value);
        const unitPrice = Number(document.getElementById('pi-price').value);
        const totalAmount = Number((qty * unitPrice).toFixed(2));
        const evVal = document.getElementById('pf-ev').value;

        Store.data.purchases.unshift({
          id: Utils.nextId(Store.data.purchases),
          financialYear: Utils.getFY(y, m),
          purchaseDate: dt,
          eventId: evVal ? Number(evVal) : null,
          vendorName: document.getElementById('pf-ven').value.trim(),
          invoiceNo: document.getElementById('pf-inv').value.trim(),
          paymentMode: document.getElementById('pf-mode').value,
          totalAmount,
          remarks: document.getElementById('pf-rem').value.trim(),
          status: 'Active',
          items: [{
            name: document.getElementById('pi-name').value.trim(),
            category: document.getElementById('pi-cat').value,
            qty,
            unit: document.getElementById('pi-unit').value.trim() || 'Pcs',
            unitPrice
          }]
        });
        Store.save();
        Store.logAudit('Expenditure', 'Create', `Recorded purchase bill of ₹${totalAmount} from ${Store.data.purchases[0].vendorName}.`);
        Modal.close();
        Toast.show('Purchase bill saved & cashbook updated.', 'success');
        this.navigate('purchases');
      },

      reversePurchase(id) {
        const p = Store.data.purchases.find(x => x.id === id);
        if (!p) return;
        p.status = 'Reversed';
        Store.save();
        Store.logAudit('Expenditure', 'Reverse', `Reversed purchase bill #${id} of ₹${p.totalAmount}.`);
        Toast.show('Purchase bill marked as Reversed.', 'warning');
        this.navigate('purchases');
      },

                          <div class="font-bold text-sm text-white">${Utils.escapeHtml(sName)}</div>
                          <div class="text-[11px] font-semibold text-gold-300">${Utils.escapeHtml(sDesig)}</div>
                          <p class="text-xs italic text-slate-200 line-clamp-2">“${Utils.escapeHtml(sQuote || 'No quote attached')}”</p>

              </div>

      openAlbumModal() {

          <form onsubmit="AdminApp.saveAlbum(event)" class="space-y-4">
            <div><label class="block text-xs font-bold mb-1">Album Title *</label><input id="al-title" required placeholder="e.g. November Birthday Celebrations" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>

              <div><label class="block text-xs font-bold mb-1">Celebration Date *</label><input id="al-date" type="date" value="${Utils.todayIso()}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>

        const secTextEl = document.getElementById('al-sec-text');
        const sectionId = secSelect ? Number(secSelect.value) : Store.findOrCreateSection(secTextEl?.value.trim() || 'RB-GEN');

        Store.data.albums.unshift({
          id: Utils.nextId(Store.data.albums),
          title: document.getElementById('al-title').value.trim(),
          eventDate: document.getElementById('al-date').value,
          employeeNames: document.getElementById('al-emps').value.trim(),
          sectionId,
          isPublished: true,
          photos: []
        });
        Store.save();
        Store.logAudit('Gallery', 'Create Album', `Created album "${Store.data.albums[0].title}".`);
        Modal.close();
        Toast.show('Photo album created.', 'success');
        this.navigate('gallery');
      },

      openAddPhotoModal(albumId) {
        this.pendingPhotoDataUrl = '';
        const activeEmps = Store.data.employees.filter(e => e.isActive);
        Modal.open('Upload Birthday Photo (Auto-Attaches Quote)', `
          <form onsubmit="AdminApp.savePhoto(event, ${albumId})" class="space-y-4">
            <div class="p-3 rounded-xl bg-gold-50 border border-gold-200 text-xs text-navy-900">
              <i class="fa-solid fa-wand-magic-sparkles text-gold-600 mr-1"></i>Select the Birthday Star below—their <strong>Name, Designation, and Quote</strong> written by them will automatically attach onto the picture!
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Select Birthday Star (Auto-Fills Name, Designation &amp; Quote)</label>
              <select id="ph-emp" onchange="AdminApp.autoFillPhotoQuote(this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                <option value="">-- Choose Birthday Star or Enter Manually Below --</option>
                ${activeEmps.map(e => `<option value="${e.id}">${Utils.escapeHtml(e.fullName)} (${Utils.escapeHtml(e.designation)} • ${Utils.escapeHtml(Store.sectionName(e.sectionId))})</option>`).join('')}

            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="block text-xs font-bold mb-1">Birthday Person's Name *</label><input id="ph-star-name" required placeholder="e.g. Shri R. K. Verma" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div><label class="block text-xs font-bold mb-1">Designation &amp; Section *</label><input id="ph-star-desig" required placeholder="e.g. Section Officer • Establishment" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Attached Birthday Quote (Auto-Fetched if Submitted by Employee)</label>
              <textarea id="ph-quote" rows="2" placeholder="Quote written by the birthday person appears here automatically..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm"></textarea>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Upload Photograph from Computer *</label>
              <input type="file" accept="image/*" required onchange="AdminApp.handlePhotoFileSelect(this)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
              <img id="ph-preview" src="" alt="Preview" class="hidden mt-3 max-h-44 rounded-xl border border-gold-300 object-cover" />
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="Modal.close()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">Publish Photo with Quote</button>
            </div>
          </form>
        `, 'max-w-lg');
      },

      autoFillPhotoQuote(empId) {
        if (!empId) return;
        const emp = Store.employeeById(empId);
        if (!emp) return;
        document.getElementById('ph-star-name').value = emp.fullName;
        document.getElementById('ph-star-desig').value = `${emp.designation} • ${Store.sectionName(emp.sectionId)} (${emp.directorate || Store.sectionDirectorate(emp.sectionId)})`;
        const q = Store.getEmployeeQuote(emp.id, emp.fullName);
        document.getElementById('ph-quote').value = q || '';
        if (q) Toast.show(`Attached quote written by ${emp.fullName}!`, 'success');
      },

      handlePhotoFileSelect(input) {
        const file = input.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          Toast.show('Please choose a valid image file.', 'error');
          input.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingPhotoDataUrl = reader.result;
          const prev = document.getElementById('ph-preview');
          if (prev) {
            prev.src = this.pendingPhotoDataUrl;
            prev.classList.remove('hidden');
          }
        };
        reader.readAsDataURL(file);
      },

      savePhoto(e, albumId) {
        e.preventDefault();
        if (!this.pendingPhotoDataUrl) {
          Toast.show('Please select an image file to upload.', 'error');
          return;
        }
        const album = Store.data.albums.find(a => a.id === albumId);
        if (!album) return;
        const empVal = document.getElementById('ph-emp').value;
        const starName = document.getElementById('ph-star-name').value.trim();
        const designation = document.getElementById('ph-star-desig').value.trim();
        const attachedQuote = document.getElementById('ph-quote').value.trim();

        album.photos.push({
          id: Utils.nextId(album.photos),
          url: this.pendingPhotoDataUrl,
          employeeId: empVal ? Number(empVal) : null,
          starName,
          designation,
          attachedQuote,
          caption: attachedQuote || starName,
          isPublished: true
        });
        this.pendingPhotoDataUrl = '';
        Store.save();
        Store.logAudit('Gallery', 'Upload Photo', `Uploaded photo for ${starName} with attached quote in "${album.title}".`);
        Modal.close();
        Toast.show('Celebration photo published with attached quote!', 'success');
        this.navigate('gallery');
      },

      /* 6.11 APPROVALS QUEUE, QUOTES, USERS, AUDIT & SETTINGS */
      renderApprovals() {
        const msgs = Store.data.birthdayMessages.filter(m => m.status === 'Pending');
        const wishes = Store.data.wishes.filter(w => w.status === 'Pending');
        const stories = Store.data.testimonials.filter(t => t.status === 'Pending');

        return `
          <div class="space-y-6">
            <div>
              <h1 class="font-serif text-2xl font-bold text-navy-900">Content Moderation &amp; Approvals Queue</h1>
              <p class="text-xs text-slate-500">Approve or reject employee-submitted Birthday Star Quotes, Colleague Wishes, and Stories.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-navy-900">Birthday Star Quotes (${msgs.length})</h3>
                ${msgs.length ? msgs.map(m => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2">
                    <div class="font-bold">${Utils.escapeHtml(m.submittedName)}</div>
                    <p class="italic text-slate-700">"${Utils.escapeHtml(m.message)}"</p>
                    <div class="flex gap-2">
                      <button onclick="AdminApp.moderate('birthdayMessages', ${m.id}, 'Approved')" class="px-2.5 py-1 rounded-lg bg-emerald-700 text-white font-bold">Approve</button>
                      <button onclick="AdminApp.moderate('birthdayMessages', ${m.id}, 'Rejected')" class="px-2.5 py-1 rounded-lg bg-rose-700 text-white font-bold">Reject</button>
                    </div>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400">No pending birthday quotes.</p>'}
              </div>

              <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-navy-900">Birthday Wishes (${wishes.length})</h3>
                ${wishes.length ? wishes.map(w => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2">
                    <div class="font-bold">${Utils.escapeHtml(w.senderName)} → ${Utils.escapeHtml(w.targetName)}</div>
                    <p class="italic text-slate-700">"${Utils.escapeHtml(w.message)}"</p>
                    <div class="flex gap-2">
                      <button onclick="AdminApp.moderate('wishes', ${w.id}, 'Approved')" class="px-2.5 py-1 rounded-lg bg-emerald-700 text-white font-bold">Approve</button>
                      <button onclick="AdminApp.moderate('wishes', ${w.id}, 'Rejected')" class="px-2.5 py-1 rounded-lg bg-rose-700 text-white font-bold">Reject</button>
                    </div>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400">No pending wishes.</p>'}
              </div>

              <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-navy-900">Employee Stories (${stories.length})</h3>
                ${stories.length ? stories.map(s => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2">
                    <div class="font-bold">${Utils.escapeHtml(s.title)} — ${Utils.escapeHtml(s.employeeName)}</div>
                    <p class="text-slate-700">${Utils.escapeHtml(s.story)}</p>
                    <div class="flex gap-2">
                      <button onclick="AdminApp.moderate('testimonials', ${s.id}, 'Approved')" class="px-2.5 py-1 rounded-lg bg-emerald-700 text-white font-bold">Approve &amp; Publish</button>
                      <button onclick="AdminApp.moderate('testimonials', ${s.id}, 'Rejected')" class="px-2.5 py-1 rounded-lg bg-rose-700 text-white font-bold">Reject</button>
                    </div>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400">No pending stories.</p>'}
              </div>
            </div>
          </div>
        `;
      },

      moderate(collection, id, decision) {
        const item = Store.data[collection]?.find(x => x.id === id);
        if (!item) return;
        item.status = decision;
        if (collection === 'testimonials') item.isPublished = (decision === 'Approved');
        Store.save();
        Store.logAudit('Moderation', decision, `${decision} item #${id} in ${collection}.`);
        Toast.show(`Item marked as ${decision}.`, decision === 'Approved' ? 'success' : 'warning');
        this.navigate('approvals');
      },

      renderQuotes() {
        return `
          <div class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="font-serif text-2xl font-bold text-navy-900">Motivational Quotes (Thought of the Day)</h1>
                <p class="text-xs text-slate-500">Manage daily motivational quotes displayed automatically on the public home page.</p>
              </div>
              <button onclick="AdminApp.openQuoteModal()" class="px-4 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">
                <i class="fa-solid fa-plus mr-1.5 text-gold-400"></i>Add Quote
              </button>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">
              ${Store.data.quotes.map(q => `
                <div class="p-4 flex items-center justify-between gap-4">
                  <div>
                    <p class="font-serif italic text-sm text-navy-900">“${Utils.escapeHtml(q.text)}”</p>
                    <div class="text-xs text-slate-500 mt-0.5">— ${Utils.escapeHtml(q.author)} ${q.scheduledDate ? `• Scheduled: ${Utils.formatDate(q.scheduledDate)}` : ''}</div>
                  </div>
                  <button onclick="Store.data.quotes=Store.data.quotes.filter(x=>x.id!==${q.id}); Store.save(); AdminApp.navigate('quotes');" class="text-xs text-rose-700 font-bold hover:underline">Remove</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      openQuoteModal() {
        Modal.open('Add Motivational Quote', `
          <form onsubmit="AdminApp.saveQuote(event)" class="space-y-4">
            <div><label class="block text-xs font-bold mb-1">Quote Text *</label><textarea id="qf-text" rows="3" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm"></textarea></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label class="block text-xs font-bold mb-1">Attribution</label><input id="qf-auth" value="Railway Board Thought of the Day" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div><label class="block text-xs font-bold mb-1">Schedule Date (Optional)</label><input id="qf-date" type="date" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="Modal.close()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">Save Quote</button>
            </div>
          </form>
        `, 'max-w-lg');
      },

      saveQuote(e) {
        e.preventDefault();
        Store.data.quotes.unshift({
          id: Utils.nextId(Store.data.quotes),
          text: document.getElementById('qf-text').value.trim(),
          author: document.getElementById('qf-auth').value.trim() || 'Railway Board',
          scheduledDate: document.getElementById('qf-date').value,
          isActive: true
        });
        Store.save();
        Modal.close();
        Toast.show('Motivational quote added.', 'success');
        this.navigate('quotes');
      },

      renderUsers() {
        return `
          <div class="space-y-6">
            <div>
              <h1 class="font-serif text-2xl font-bold text-navy-900">Administrator Roles &amp; Access</h1>
              <p class="text-xs text-slate-500">Authorised administrator accounts with role-based access control.</p>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-navy-900 text-white">
                  <tr>
                    <th class="px-4 py-3">Username</th>
                    <th class="px-4 py-3">Full Name</th>
                    <th class="px-4 py-3">Designation</th>
                    <th class="px-4 py-3">Role</th>
                    <th class="px-4 py-3">Last Login</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${Store.data.users.map(u => `
                    <tr>
                      <td class="px-4 py-3 font-mono font-bold text-navy-900">${Utils.escapeHtml(u.username)}</td>
                      <td class="px-4 py-3 font-semibold">${Utils.escapeHtml(u.fullName)}</td>
                      <td class="px-4 py-3">${Utils.escapeHtml(u.designation)}</td>
                      <td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full bg-gold-100 text-gold-700 font-bold">${Utils.escapeHtml(u.role)}</span></td>
                      <td class="px-4 py-3 text-slate-500">${Utils.escapeHtml(u.lastLogin || 'Never')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      renderAudit() {
        return `
          <div class="space-y-6">
            <div>
              <h1 class="font-serif text-2xl font-bold text-navy-900">System &amp; Financial Audit Trail</h1>
              <p class="text-xs text-slate-500">Immutable log of every administrative, financial, PDF extraction, and moderation event.</p>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-navy-900 text-white">
                  <tr>
                    <th class="px-4 py-3">Timestamp</th>
                    <th class="px-4 py-3">User</th>
                    <th class="px-4 py-3">Module</th>
                    <th class="px-4 py-3">Action</th>
                    <th class="px-4 py-3">Details</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${Store.data.auditLogs.map(l => `
                    <tr>
                      <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${Utils.escapeHtml(l.timestamp)}</td>
                      <td class="px-4 py-3 font-semibold text-navy-900">${Utils.escapeHtml(l.user)}</td>
                      <td class="px-4 py-3">${Utils.escapeHtml(l.entity)}</td>
                      <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full bg-navy-50 text-navy-900 font-bold">${Utils.escapeHtml(l.action)}</span></td>
                      <td class="px-4 py-3 text-slate-700">${Utils.escapeHtml(l.details)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      renderSettings() {
        return `
          <div class="space-y-6">
            <div>
              <h1 class="font-serif text-2xl font-bold text-navy-900">System Settings</h1>
              <p class="text-xs text-slate-500">Configure Financial Year, public welcome message, or clear all records.</p>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-slate-200 max-w-2xl space-y-4">
              <div>
                <label class="block text-xs font-bold mb-1">Active Financial Year</label>
                <input id="set-fy" value="${Utils.escapeHtml(Store.data.settings.currentFY)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Public Home Welcome Message</label>
                <textarea id="set-wel" rows="3" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">${Utils.escapeHtml(Store.data.settings.welcomeMessage)}</textarea>
              </div>
              <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                <button onclick="Store.data.settings.currentFY=document.getElementById('set-fy').value.trim(); Store.data.settings.welcomeMessage=document.getElementById('set-wel').value.trim(); Store.save(); Toast.show('Settings saved.', 'success'); AdminApp.navigate('settings');"
                  class="px-5 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">Save Settings</button>
                <button onclick="Store.resetAll(); Toast.show('All entries cleared to a clean slate.', 'info'); AdminApp.navigate('dashboard');"
                  class="px-4 py-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold hover:bg-rose-100">Clear All Entries (Reset to Blank)</button>
              </div>
            </div>
          </div>
        `;
      },

      render() {
        if (!Auth.currentUser()) return this.renderLogin();
        let view = '';
        switch (this.tab) {
          case 'sections': view = this.renderSections(); break;
          case 'employees': view = this.renderEmployees(); break;
          case 'events': view = this.renderEvents(); break;
          case 'rates': view = this.renderRates(); break;
          case 'calculator': view = this.renderCalculator(); break;
          case 'collections': view = this.renderCollections(); break;
          case 'income': view = this.renderIncome(); break;
          case 'purchases': view = this.renderPurchases(); break;
          case 'finance': view = this.renderFinance(); break;
          case 'reports': view = this.renderReports(); break;
          case 'gallery': view = this.renderGallery(); break;
          case 'approvals': view = this.renderApprovals(); break;
          case 'quotes': view = this.renderQuotes(); break;
          case 'users': view = this.renderUsers(); break;
          case 'audit': view = this.renderAudit(); break;
          case 'settings': view = this.renderSettings(); break;
          default: view = this.renderDashboard(); break;
        }
        return this.renderShell(view);
      }
    };

    /* ==========================================================================
       7. ROOT APPLICATION BOOTSTRAPPER
       ========================================================================== */
    const App = {
      mode: 'public',
      init() {
        Store.init();
        if (Auth.currentUser()) this.mode = 'admin';
        PublicApp.startSlideshow();
        this.render();
      },
      openLogin() {
        this.mode = 'admin';
        this.render();
      },
      backToPublic() {
        this.mode = 'public';
        PublicApp.route = 'home';
        this.render();
      },
      render() {
        const root = document.getElementById('app');
        if (this.mode === 'admin') {
          root.innerHTML = AdminApp.render();
          if (Auth.currentUser() && AdminApp.tab === 'dashboard') {
            requestAnimationFrame(() => AdminApp.initDashboardCharts());
          }
        } else {
          root.innerHTML = PublicApp.render();
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
