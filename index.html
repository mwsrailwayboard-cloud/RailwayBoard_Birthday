<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Celebration – Railway Board</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Chart.js for Dynamic Admin Graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- PDF.js for Direct PDF Upload & Data Extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#eef3f9',
              100: '#d5e1f0',
              700: '#163a66',
              800: '#102d52',
              900: '#0B2545',
              950: '#07182e'
            },
            gold: {
              50: '#fdf9ec',
              100: '#faf0cc',
              200: '#f3df96',
              400: '#dfba4b',
              500: '#C9A227',
              600: '#a88419',
              700: '#826412'
            },
            cream: '#FDFBF7',
            blush: '#FFF1E6',
            skysoft: '#EAF4FB'
          },
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-cream text-slate-800 font-sans antialiased selection:bg-gold-200 selection:text-navy-900">
  <!-- Main Application Shell -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Global Non-Blocking Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Global Reusable Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-navy-950/60 backdrop-blur-xs z-40 hidden items-center justify-center p-4 overflow-y-auto" onclick="if(event.target===this) Modal.close()">
    <div id="modal-box" class="bg-white rounded-2xl shadow-2xl border border-gold-200 w-full max-w-2xl overflow-hidden my-8 transform transition-all">
      <div class="bg-navy-900 text-white px-6 py-4 flex items-center justify-between border-b-2 border-gold-500">
        <h3 id="modal-title" class="font-semibold text-base sm:text-lg tracking-wide">Modal</h3>
        <button type="button" onclick="Modal.close()" class="text-slate-300 hover:text-gold-400 p-1.5 rounded-lg transition" aria-label="Close modal">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 max-h-[80vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- Lightbox Modal for Gallery -->
  <div id="lightbox-backdrop" class="fixed inset-0 bg-navy-950/90 z-50 hidden items-center justify-center p-4" onclick="if(event.target===this) PublicApp.closeLightbox()">
    <div class="max-w-4xl w-full bg-navy-900 rounded-2xl overflow-hidden border border-gold-500/40 shadow-2xl">
      <div class="flex items-center justify-between px-5 py-3 bg-navy-950 text-white">
        <span id="lightbox-title" class="text-sm font-semibold text-gold-400"></span>
        <button onclick="PublicApp.closeLightbox()" class="text-slate-300 hover:text-white px-2 py-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="bg-black flex items-center justify-center max-h-[68vh] overflow-hidden">
        <img id="lightbox-img" src="" alt="Celebration Moment" class="max-h-[68vh] w-auto object-contain" />
      </div>
      <div class="px-6 py-4 bg-navy-900 text-white border-t border-navy-700">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <div id="lightbox-star" class="font-serif text-lg font-bold text-white"></div>
            <div id="lightbox-desig" class="text-xs font-semibold text-gold-400"></div>
          </div>
          <span id="lightbox-date" class="text-xs text-slate-300"></span>
        </div>
        <p id="lightbox-caption" class="font-serif italic text-sm sm:text-base text-slate-100 mt-2"></p>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. CONSTANTS, INDIAN RAILWAYS EMBLEM & UTILITIES
       ========================================================================== */
    const STORAGE_KEY = 'rb_birthday_portal_clean_v1';
    const SESSION_KEY = 'rb_birthday_admin_session_v1';

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const BRAND = {
      title: 'BIRTHDAY CELEBRATION',
      org: 'RAILWAY BOARD',
      tagline1: 'Together We Celebrate, Together We Grow!',
      tagline2: 'Celebrating People. Creating Memories. Spreading Happiness.',
      welcome: 'Every birthday is an opportunity to celebrate life, appreciate people and create beautiful memories together. Let us make every celebration special!',
      noBirthdays: 'No birthdays today, but every day is a reason to celebrate!',
      defaultGreeting: 'May your day be filled with happiness, success and wonderful memories.'
    };

    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const ITEM_CATEGORIES = ['Birthday Cake', 'Sweets', 'Snacks', 'Beverages', 'Flowers', 'Decoration', 'Gifts', 'Miscellaneous'];
    const PAYMENT_MODES = ['Cash', 'UPI', 'Bank Transfer', 'Other'];
    const TESTIMONIAL_CATS = [
      'My Experience at Railway Board',
      'Lessons from My Journey',
      'Teamwork & Togetherness',
      'Words of Wisdom',
      'Memorable Moments',
      'Gratitude & Appreciation'
    ];

    function indianRailwaysEmblem(sizeClass = 'w-11 h-11') {
      const fallbackSvg = `data:image/svg+xml;utf8,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="56" fill="#0B2545" stroke="#C9A227" stroke-width="5"/>
          <circle cx="60" cy="60" r="44" fill="none" stroke="#FAF0CC" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="M36 74 L44 38 L76 38 L84 74 Z" fill="#C9A227"/>
          <rect x="47" y="44" width="26" height="14" rx="2" fill="#0B2545"/>
          <circle cx="48" cy="66" r="3" fill="#0B2545"/>
          <circle cx="72" cy="66" r="3" fill="#0B2545"/>
          <line x1="28" y1="80" x2="92" y2="80" stroke="#FAF0CC" stroke-width="3"/>
          <text x="60" y="96" text-anchor="middle" fill="#FAF0CC" font-family="Arial" font-size="9" font-weight="bold">INDIAN RAILWAYS</text>
        </svg>`
      )}`;
      return `
        <div class="${sizeClass} rounded-full bg-white p-1 border-2 border-gold-400 shadow-md flex items-center justify-center shrink-0 overflow-hidden" title="Indian Railways – Railway Board">
          <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/83/Indian_Railways.svg/240px-Indian_Railways.svg.png"
               onerror="this.onerror=null;this.src='${fallbackSvg}';"
               alt="Indian Railways Logo"
               class="w-full h-full object-contain" />
        </div>
      `;
    }

    const Utils = {
      escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },
      formatCurrency(val) {
        const num = Number(val || 0);
        return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      },
      formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso + (iso.includes('T') ? '' : 'T00:00:00'));
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      },
      todayIso() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      },
      getFY(year, month) {
        const startYear = month >= 4 ? year : year - 1;
        return `${startYear}-${String((startYear + 1) % 100).padStart(2, '0')}`;
      },
      avatarUrl(name, bg = '0B2545', fg = 'FAF0CC') {
        const initials = (name || 'RB')
          .replace(/^(Shri|Smt\.|Ms\.|Dr\.|Mr\.|Mrs\.)\s+/i, '')
          .split(/\s+/)
          .slice(0, 2)
          .map(s => s[0] || '')
          .join('')
          .toUpperCase() || 'RB';
        return `https://placehold.co/240x240/${bg}/${fg}?text=${encodeURIComponent(initials)}`;
      },
      nextId(list) {
        return list.length ? Math.max(...list.map(x => Number(x.id) || 0)) + 1 : 1;
      },
      parseFlexibleDate(raw) {
        if (!raw) return '';
        const clean = String(raw).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
        const m1 = clean.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
        if (m1) {
          return `${m1[3]}-${m1[2].padStart(2, '0')}-${m1[1].padStart(2, '0')}`;
        }
        const monthMap = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
        const m2 = clean.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s\-\/]?(\d{2,4})?$/);
        if (m2) {
          const mon = monthMap[m2[2].slice(0, 3).toLowerCase()];
          if (mon) {
            const yr = m2[3] ? (m2[3].length === 2 ? '19' + m2[3] : m2[3]) : '1990';
            return `${yr}-${String(mon).padStart(2, '0')}-${m2[1].padStart(2, '0')}`;
          }
        }
        return '';
      }
    };

    const Toast = {
      show(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const styles = {
          success: 'bg-emerald-800 border-emerald-400 text-white',
          error: 'bg-rose-800 border-rose-400 text-white',
          warning: 'bg-amber-700 border-amber-300 text-white',
          info: 'bg-navy-900 border-gold-400 text-white'
        };
        const icons = {
          success: 'fa-circle-check text-emerald-300',
          error: 'fa-circle-exclamation text-rose-300',
          warning: 'fa-triangle-exclamation text-amber-300',
          info: 'fa-bell text-gold-400'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-xl text-sm transition-all ${styles[type] || styles.info}`;
        el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} mt-0.5"></i><span class="flex-1 leading-snug">${Utils.escapeHtml(message)}</span>`;
        container.appendChild(el);
        setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => el.remove(), 250);
        }, 3600);
      }
    };

    const Modal = {
      open(title, bodyHtml, maxWidth = 'max-w-2xl') {
        const box = document.getElementById('modal-box');
        box.className = `bg-white rounded-2xl shadow-2xl border border-gold-200 w-full ${maxWidth} overflow-hidden my-8 transform transition-all`;
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = bodyHtml;
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
      },
      close() {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }
    };

    /* ==========================================================================
       2. DATA STORE & CLEAN PRODUCTION INITIAL STATE (ZERO DUMMY ENTRIES)
       ========================================================================== */
    function createCleanData() {
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth() + 1;
      const fy = Utils.getFY(y, m);

      return {
        settings: {
          currentFY: fy,
          welcomeMessage: BRAND.welcome
        },
        sections: [],
        employees: [],
        contributionRates: [
          {
            id: 1,
            amount: 10,
            effectiveFrom: `${y}-04-01`,
            effectiveTo: '',
            isActive: true,
            remarks: 'Default Railway Board policy (₹10 per employee per birthday)',
            updatedBy: 'Super Administrator',
            updatedDate: Utils.todayIso()
          }
        ],
        openingBalances: { financialYear: fy, Cash: 0, UPI: 0, 'Bank Transfer': 0, Other: 0 },
        contributions: [],
        incomeTransactions: [],
        events: [],
        purchases: [],
        quotes: [
          { id: 1, text: 'Great things are never done by one person; they are done by a team of people.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 2, text: 'Happiness is multiplied when shared.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 3, text: 'Success is best when celebrated together.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 4, text: 'Every new day is another opportunity to make a difference.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 5, text: 'A positive attitude creates positive outcomes.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 6, text: "The smallest act of kindness can make someone's day.", author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 7, text: 'Great teams are built on respect, trust and appreciation.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 8, text: 'Every journey becomes memorable when we travel together.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 9, text: 'Believe in yourself, keep learning and never stop growing.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true },
          { id: 10, text: 'A little appreciation can make a big difference.', author: 'Railway Board Thought of the Day', scheduledDate: '', isActive: true }
        ],
        birthdayMessages: [],
        wishes: [],
        testimonials: [],
        albums: [],
        users: [
          { id: 1, username: 'superadmin', password: 'RailBoard@2026', fullName: 'Super Administrator', designation: 'Chief Coordinator', role: 'Super Administrator', isActive: true, lastLogin: '' },
          { id: 2, username: 'admin', password: 'admin123', fullName: 'Portal Administrator', designation: 'Section Officer', role: 'Administrator', isActive: true, lastLogin: '' },
          { id: 3, username: 'secrep1', password: 'Section@2026', fullName: 'Section Representative', designation: 'ASO', role: 'Section Representative', isActive: true, lastLogin: '' }
        ],
        auditLogs: [
          { id: 1, timestamp: new Date().toLocaleString('en-IN'), user: 'System', entity: 'Portal', action: 'Initialize', details: `Initialised clean Railway Board Birthday Celebration portal for FY ${fy}.` }
        ]
      };
    }

    const Store = {
      data: null,
      init() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          this.data = raw ? JSON.parse(raw) : createCleanData();
          if (!this.data || !Array.isArray(this.data.sections)) this.data = createCleanData();
          this.save();
        } catch (err) {
          this.data = createCleanData();
        }
      },
      save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (_) {}
      },
      resetAll() {
        this.data = createCleanData();
        this.save();
        this.logAudit('System', 'Reset', 'Cleared all entries and restored a clean slate.');
      },
      logAudit(entity, action, details) {
        const user = Auth.currentUser();
        this.data.auditLogs.unshift({
          id: Utils.nextId(this.data.auditLogs),
          timestamp: new Date().toLocaleString('en-IN'),
          user: user ? `${user.fullName} (${user.username})` : 'Public / System',
          entity,
          action,
          details
        });
        if (this.data.auditLogs.length > 300) this.data.auditLogs.length = 300;
        this.save();
      },
      sectionById(id) {
        return this.data.sections.find(s => s.id === Number(id));
      },
      sectionName(id) {
        const s = this.sectionById(id);
        return s ? `${s.code} (${s.name})` : 'Railway Board';
      },
      sectionDirectorate(id) {
        const s = this.sectionById(id);
        return s?.directorate || 'Railway Board Dte.';
      },
      findOrCreateSection(secInput, dteInput = '') {
        const cleanSec = String(secInput || '').trim();
        const cleanDte = String(dteInput || '').trim();
        if (!cleanSec) {
          return this.data.sections[0]?.id || 0;
        }
        let existing = this.data.sections.find(
          s => s.code.toLowerCase() === cleanSec.toLowerCase() || s.name.toLowerCase() === cleanSec.toLowerCase()
        );
        if (!existing) {
          const newSec = {
            id: Utils.nextId(this.data.sections),
            code: cleanSec.toUpperCase().slice(0, 18),
            name: cleanSec,
            directorate: cleanDte || 'Railway Board Dte.',
            inCharge: '',
            remarks: 'Added via Directory / Import',
            isActive: true
          };
          this.data.sections.push(newSec);
          existing = newSec;
        } else if (cleanDte && !existing.directorate) {
          existing.directorate = cleanDte;
        }
        return existing.id;
      },
      employeeById(id) {
        return this.data.employees.find(e => e.id === Number(id));
      },
      getEmployeeQuote(empId, fallbackName = '') {
        const msgs = this.data.birthdayMessages.filter(m => m.status === 'Approved');
        let match = null;
        if (empId) match = msgs.find(m => Number(m.employeeId) === Number(empId));
        if (!match && fallbackName) {
          match = msgs.find(m => m.submittedName.toLowerCase() === fallbackName.trim().toLowerCase());
        }
        return match ? match.message : '';
      }
    };

    const Auth = {
      currentUser() {
        try {
          const raw = sessionStorage.getItem(SESSION_KEY);
          if (!raw) return null;
          const sess = JSON.parse(raw);
          return Store.data.users.find(u => u.id === sess.userId && u.isActive) || null;
        } catch {
          return null;
        }
      },
      login(username, password) {
        const user = Store.data.users.find(
          u => u.username.toLowerCase() === username.trim().toLowerCase() && u.password === password
        );
        if (!user) {
          Store.logAudit('Security', 'Login Failed', `Failed login attempt for username "${username}".`);
          return { ok: false, error: 'Invalid administrator username or password.' };
        }
        if (!user.isActive) {
          return { ok: false, error: 'This administrator account is deactivated.' };
        }
        user.lastLogin = new Date().toLocaleString('en-IN');
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, loginAt: Date.now() }));
        Store.save();
        Store.logAudit('Security', 'Login Success', `${user.fullName} signed in as ${user.role}.`);
        return { ok: true, user };
      },
      logout() {
        const u = this.currentUser();
        if (u) Store.logAudit('Security', 'Logout', `${u.fullName} signed out.`);
        sessionStorage.removeItem(SESSION_KEY);
      }
    };

    /* ==========================================================================
       3. BIRTHDAY, CONTRIBUTION & FINANCIAL CALCULATION ENGINE
       ========================================================================== */
    const Engine = {
      getBirthdayInYear(dobIso, year) {
        if (!dobIso) return null;
        const parts = dobIso.split('-').map(Number);
        let m = parts[1], d = parts[2];
        const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        if (m === 2 && d === 29 && !isLeap) d = 28;
        return new Date(year, m - 1, d);
      },
      getTodaysBirthdays() {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
        return Store.data.employees.filter(e => {
          if (!e.isActive || !e.dob) return false;
          const bday = this.getBirthdayInYear(e.dob, y);
          return bday && bday.getMonth() === m && bday.getDate() === d;
        });
      },
      getUpcomingBirthdays(maxDays = 30) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const list = [];
        Store.data.employees.filter(e => e.isActive && e.dob).forEach(e => {
          let next = this.getBirthdayInYear(e.dob, today.getFullYear());
          if (next < today) next = this.getBirthdayInYear(e.dob, today.getFullYear() + 1);
          const diffDays = Math.round((next - today) / 86400000);
          if (diffDays >= 1 && diffDays <= maxDays) {
            list.push({ ...e, nextDate: next, daysLeft: diffDays });
          }
        });
        return list.sort((a, b) => a.daysLeft - b.daysLeft);
      },
      getFeaturedQuote() {
        const active = Store.data.quotes.filter(q => q.isActive);
        if (!active.length) return { text: BRAND.tagline1, author: BRAND.org };
        const today = Utils.todayIso();
        const scheduled = active.find(q => q.scheduledDate === today);
        if (scheduled) return scheduled;
        const dayIndex = Math.floor(Date.now() / 86400000) % active.length;
        return active[dayIndex];
      },
      getApplicableRate(year, month) {
        const target = `${year}-${String(month).padStart(2, '0')}-01`;
        const matches = Store.data.contributionRates
          .filter(r => r.isActive && r.effectiveFrom <= target && (!r.effectiveTo || r.effectiveTo >= target))
          .sort((a, b) => b.effectiveFrom.localeCompare(a.effectiveFrom));
        return matches[0] || Store.data.contributionRates[0] || { id: 0, amount: 10 };
      },
      getBirthdaysInMonth(month) {
        return Store.data.employees.filter(e => e.isActive && e.dob && Number(e.dob.split('-')[1]) === Number(month));
      },
      getMonthlyStatement(year, month) {
        const rateObj = this.getApplicableRate(year, month);
        const rate = Number(rateObj.amount || 0);
        const bdayEmps = this.getBirthdaysInMonth(month);
        const bdayCount = bdayEmps.length;
        const expectedPerEmp = bdayCount * rate;
        const activeEmps = Store.data.employees.filter(e => e.isActive);

        const rows = activeEmps.map(emp => {
          const paid = Store.data.contributions
            .filter(c => c.status === 'Active' && c.year === year && c.month === month && c.employeeId === emp.id)
            .reduce((sum, c) => sum + Number(c.amountReceived), 0);
          const pending = Math.max(0, expectedPerEmp - paid);
          return {
            employee: emp,
            sectionName: Store.sectionName(emp.sectionId),
            directorate: emp.directorate || Store.sectionDirectorate(emp.sectionId),
            birthdayCount: bdayCount,
            rate,
            expected: expectedPerEmp,
            paid,
            pending,
            status: expectedPerEmp === 0 ? 'No Birthdays' : (paid >= expectedPerEmp ? 'Paid' : (paid > 0 ? 'Partial' : 'Pending'))
          };
        });

        return { year, month, rateObj, rate, birthdayEmployees: bdayEmps, birthdayCount: bdayCount, expectedPerEmp, rows };
      },
      getFinancialSummary(fy = Store.data.settings.currentFY) {
        const ob = Store.data.openingBalances.financialYear === fy
          ? Store.data.openingBalances
          : { Cash: 0, UPI: 0, 'Bank Transfer': 0, Other: 0 };

        const openingTotal = Number(ob.Cash || 0) + Number(ob.UPI || 0) + Number(ob['Bank Transfer'] || 0) + Number(ob.Other || 0);
        const activeContribs = Store.data.contributions.filter(c => c.status === 'Active' && c.financialYear === fy);
        const activeIncome = Store.data.incomeTransactions.filter(i => i.status === 'Active' && i.financialYear === fy);
        const activeExp = Store.data.purchases.filter(p => p.status === 'Active' && p.financialYear === fy);

        const contribTotal = activeContribs.reduce((s, c) => s + Number(c.amountReceived), 0);
        const otherIncomeTotal = activeIncome.reduce((s, i) => s + Number(i.amount), 0);
        const totalFunds = openingTotal + contribTotal + otherIncomeTotal;
        const totalExpenditure = activeExp.reduce((s, p) => s + Number(p.totalAmount), 0);
        const closingBalance = totalFunds - totalExpenditure;

        const modes = {};
        PAYMENT_MODES.forEach(m => {
          const mOpen = Number(ob[m] || 0);
          const mContrib = activeContribs.filter(c => c.paymentMode === m).reduce((s, c) => s + Number(c.amountReceived), 0);
          const mInc = activeIncome.filter(i => i.paymentMode === m).reduce((s, i) => s + Number(i.amount), 0);
          const mExp = activeExp.filter(p => p.paymentMode === m).reduce((s, p) => s + Number(p.totalAmount), 0);
          modes[m] = {
            opening: mOpen,
            receipts: mContrib + mInc,
            expenditure: mExp,
            closing: mOpen + mContrib + mInc - mExp
          };
        });

        const now = new Date();
        const curStmt = this.getMonthlyStatement(now.getFullYear(), now.getMonth() + 1);
        const currentMonthPending = curStmt.rows.reduce((s, r) => s + r.pending, 0);

        return {
          fy,
          openingTotal,
          contribTotal,
          otherIncomeTotal,
          totalFunds,
          totalExpenditure,
          closingBalance,
          currentMonthPending,
          modes
        };
      }
    };

    /* ==========================================================================
       4. EXCEL / CSV EXPORTER & DIRECT PDF DATA EXTRACTOR
       ========================================================================== */
    const Exporter = {
      downloadCsv(filename, headers, rows) {
        const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const lines = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))];
        const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
        Toast.show(`Exported ${filename}`, 'success');
      },
      exportEmployees() {
        const headers = ['Employee ID', 'Name', 'Designation', 'Section', 'Directorate (Dte.)', 'Date of Birth', 'Email', 'Status'];
        const rows = Store.data.employees.map(e => [
          e.empCode || '', e.fullName, e.designation, Store.sectionName(e.sectionId),
          e.directorate || Store.sectionDirectorate(e.sectionId), e.dob, e.email || '', e.isActive ? 'Active' : 'Inactive'
        ]);
        this.downloadCsv(`RailwayBoard_Birthday_Members_${Utils.todayIso()}.csv`, headers, rows);
      },
      exportCollections() {
        const headers = ['Receipt Date', 'FY', 'Month', 'Employee Name', 'Section', 'Directorate (Dte.)', 'Amount Received (INR)', 'Mode', 'Reference', 'Status'];
        const rows = Store.data.contributions.map(c => {
          const emp = Store.employeeById(c.employeeId);
          return [
            c.receiptDate, c.financialYear, `${MONTHS[c.month - 1]} ${c.year}`,
            emp?.fullName || c.employeeNameSnapshot || '', Store.sectionName(c.sectionIdSnapshot),
            c.directorateSnapshot || emp?.directorate || Store.sectionDirectorate(c.sectionIdSnapshot),
            c.amountReceived, c.paymentMode, c.reference || '', c.status
          ];
        });
        this.downloadCsv(`RailwayBoard_Contributors_List_${Utils.todayIso()}.csv`, headers, rows);
      },
      exportFinancialStatement() {
        const fin = Engine.getFinancialSummary();
        const headers = ['Account / Mode', 'Opening Balance (INR)', 'Total Receipts (INR)', 'Total Expenditure (INR)', 'Closing Balance (INR)'];
        const rows = PAYMENT_MODES.map(m => [
          m, fin.modes[m].opening.toFixed(2), fin.modes[m].receipts.toFixed(2),
          fin.modes[m].expenditure.toFixed(2), fin.modes[m].closing.toFixed(2)
        ]);
        rows.push(['TOTAL', fin.openingTotal.toFixed(2), (fin.contribTotal + fin.otherIncomeTotal).toFixed(2), fin.totalExpenditure.toFixed(2), fin.closingBalance.toFixed(2)]);
        this.downloadCsv(`RailwayBoard_Accounts_Statement_${fin.fy}.csv`, headers, rows);
      },
      printPage(title) {
        Toast.show(`Preparing printable PDF report: ${title}`, 'info');
        setTimeout(() => window.print(), 300);
      }
    };

    const PdfExtractor = {
      async extractFromFile(file) {
        if (!window.pdfjsLib) {
          throw new Error('PDF parser library is still loading. Please try again in a moment.');
        }
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const lines = [];
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          const byY = {};
          content.items.forEach(item => {
            const str = (item.str || '').trim();
            if (!str) return;
            const y = Math.round(item.transform[5] / 5) * 5;
            if (!byY[y]) byY[y] = [];
            byY[y].push({ x: item.transform[4], str });
          });
          Object.keys(byY)
            .map(Number)
            .sort((a, b) => b - a)
            .forEach(y => {
              const rowItems = byY[y].sort((a, b) => a.x - b.x);
              lines.push(rowItems.map(i => i.str).join(' | '));
            });
        }
        return lines;
      },
      parseMemberRows(lines) {
        const parsed = [];
        lines.forEach(line => {
          if (/^(sl|s\.?no|sr|name|employee|section|directorate|date of birth|dob)/i.test(line.trim())) return;
          const cols = line.split(/\s*\|\s*|\t+|,{1}/).map(c => c.trim()).filter(Boolean);
          if (cols.length < 2) return;
          let idx = /^\d+[\.\)]?$/.test(cols[0]) ? 1 : 0;
          const remaining = cols.slice(idx);
          if (!remaining.length) return;

          let dob = '';
          const nonDateCols = [];
          remaining.forEach(token => {
            const d = Utils.parseFlexibleDate(token);
            if (d && !dob) dob = d;
            else nonDateCols.push(token);
          });

          const name = nonDateCols[0] || '';
          if (!name || name.length < 2) return;
          parsed.push({
            name,
            designation: nonDateCols[1] || 'Officer / Staff',
            section: nonDateCols[2] || (Store.data.sections[0]?.code || 'RB-GEN'),
            directorate: nonDateCols[3] || 'Railway Board Dte.',
            dob: dob || '1990-01-01'
          });
        });
        return parsed;
      },
      parseContributorRows(lines) {
        const parsed = [];
        lines.forEach(line => {
          if (/^(sl|s\.?no|sr|name|employee|section|directorate|amount|contribution)/i.test(line.trim())) return;
          const cols = line.split(/\s*\|\s*|\t+|,{1}/).map(c => c.trim()).filter(Boolean);
          if (cols.length < 2) return;
          let idx = /^\d+[\.\)]?$/.test(cols[0]) ? 1 : 0;
          const remaining = cols.slice(idx);

          let amount = 0;
          let mode = 'UPI';
          const textCols = [];
          remaining.forEach(tok => {
            const numMatch = tok.replace(/[₹,\s]/g, '').match(/^\d+(\.\d+)?$/);
            if (numMatch && !amount) {
              amount = Number(numMatch[0]);
            } else if (/^(cash|upi|bank|neft|imps|rtgs|online)$/i.test(tok)) {
              mode = /cash/i.test(tok) ? 'Cash' : (/upi/i.test(tok) ? 'UPI' : 'Bank Transfer');
            } else {
              textCols.push(tok);
            }
          });

          const name = textCols[0] || '';
          if (!name || name.length < 2) return;
          parsed.push({
            name,
            section: textCols[1] || (Store.data.sections[0]?.code || 'RB-GEN'),
            directorate: textCols[2] || 'Railway Board Dte.',
            amount: amount || 10,
            mode,
            reference: textCols[3] || ''
          });
        });
        return parsed;
      }
    };

                </button>
              </div>
              ${stories.length ? `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  ${stories.map(t => `
                    <article class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between">
                      <div>
                        <span class="inline-block px-3 py-1 rounded-full bg-gold-50 text-gold-700 text-[11px] font-bold mb-3">${Utils.escapeHtml(t.category)}</span>

                <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                  <p class="text-sm text-slate-600">No stories published yet. Be the first Railway Board colleague to share your journey and experiences!</p>

      renderBirthdayStarsGrid(employees) {
        if (!employees.length) {
          return `
            <div class="bg-gradient-to-r from-blush via-white to-skysoft rounded-3xl p-10 text-center border border-gold-200 shadow-sm">
              <div class="w-16 h-16 rounded-full bg-gold-100 text-gold-700 flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-champagne-glasses"></i>
              </div>

              <p class="text-sm text-slate-600 mt-2 max-w-lg mx-auto">${BRAND.tagline2}</p>
            </div>
          `;
        }

        const approvedMsgs = Store.data.birthdayMessages.filter(m => m.status === 'Approved');
        const approvedWishes = Store.data.wishes.filter(w => w.status === 'Approved');

        return `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            ${employees.map(emp => {
              const starMsg = approvedMsgs.find(m => Number(m.employeeId) === emp.id || m.submittedName.toLowerCase() === emp.fullName.toLowerCase());
              const empWishes = approvedWishes.filter(w => Number(w.targetEmployeeId) === emp.id);
              return `
                <div class="bg-white rounded-3xl overflow-hidden border-2 border-gold-400 shadow-xl">
                  <div class="bg-gradient-to-r from-navy-900 via-navy-800 to-navy-900 px-6 py-4 flex items-center justify-between text-white">
                    <div>
                      <span class="text-xs font-extrabold tracking-[0.2em] text-gold-400 uppercase">HAPPY BIRTHDAY!</span>
                      <p class="text-xs text-slate-200 mt-0.5">${BRAND.defaultGreeting}</p>
                    </div>
                    <i class="fa-solid fa-cake-candles text-2xl text-gold-400"></i>
                  </div>
                  <div class="p-6">
                    <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
                      <img src="${Utils.escapeHtml(emp.photo || Utils.avatarUrl(emp.fullName))}" onerror="this.src='${Utils.avatarUrl(emp.fullName)}'"
                        class="w-24 h-24 rounded-2xl object-cover ring-4 ring-gold-200 shadow-md shrink-0" alt="${Utils.escapeHtml(emp.fullName)}" />
                      <div class="text-center sm:text-left flex-1">
                        <h3 class="font-serif text-2xl font-bold text-navy-900">${Utils.escapeHtml(emp.fullName)}</h3>
                        <p class="text-sm font-medium text-slate-600">${Utils.escapeHtml(emp.designation)}</p>
                        <div class="flex flex-wrap justify-center sm:justify-start gap-1.5 mt-2">
                          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-navy-50 text-navy-800 text-xs font-semibold">
                            <i class="fa-solid fa-building-user text-gold-600"></i>${Utils.escapeHtml(Store.sectionName(emp.sectionId))}
                          </span>
                          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gold-50 text-gold-700 text-xs font-semibold">
                            ${Utils.escapeHtml(emp.directorate || Store.sectionDirectorate(emp.sectionId))}
                          </span>
                        </div>
                      </div>
                    </div>

                    ${starMsg ? `
                      <div class="mt-5 bg-gold-50/80 border-l-4 border-gold-500 rounded-r-2xl p-4">
                        <div class="text-[11px] font-bold uppercase tracking-wider text-gold-700 mb-1">
                          <i class="fa-solid fa-quote-left mr-1"></i>Birthday Star's Personal Message
                        </div>
                        <p class="font-serif italic text-sm text-navy-900 leading-relaxed">"${Utils.escapeHtml(starMsg.message)}"</p>
                        <div class="text-xs font-semibold text-slate-600 mt-1.5">— ${Utils.escapeHtml(emp.fullName)}</div>
                      </div>
                    ` : ''}

                    <div class="mt-5 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                      <span class="text-xs text-slate-500">
                        <i class="fa-solid fa-heart text-rose-500 mr-1"></i>${empWishes.length} Approved Colleague Wish${empWishes.length === 1 ? '' : 'es'}
                      </span>
                      <button onclick="PublicApp.openWishModal(${emp.id})" class="px-4 py-2 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold transition">
                        <i class="fa-solid fa-paper-plane mr-1.5 text-gold-400"></i>Send Birthday Wish
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      },

      renderToday() {
        const todays = Engine.getTodaysBirthdays();
        return `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="mb-8">
              <span class="text-xs font-bold uppercase tracking-widest text-gold-600">${Utils.formatDate(Utils.todayIso())}</span>
              <h1 class="font-serif text-3xl sm:text-4xl font-bold text-navy-900 mt-1">Today's Birthday Stars</h1>
              <p class="text-sm text-slate-600 mt-1">${BRAND.defaultGreeting}</p>
            </div>
            ${this.renderBirthdayStarsGrid(todays)}
          </div>
        `;
      },

      renderUpcoming() {
        let list = Engine.getUpcomingBirthdays(365);
        if (this.upcomingDays !== 'ALL') list = list.filter(e => e.daysLeft <= Number(this.upcomingDays));
        if (this.upcomingSection !== 'ALL') list = list.filter(e => String(e.sectionId) === String(this.upcomingSection));
        if (this.upcomingMonth !== 'ALL') list = list.filter(e => (e.nextDate.getMonth() + 1) === Number(this.upcomingMonth));

        return `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
              <div>
                <span class="text-xs font-bold uppercase tracking-widest text-gold-600">Celebration Planner</span>
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-navy-900 mt-1">Upcoming Birthdays</h1>
              </div>
              <div class="flex flex-wrap gap-2">
                ${[7, 15, 30, 'ALL'].map(d => `
                  <button onclick="PublicApp.upcomingDays='${d}'; App.render();"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                      String(this.upcomingDays) === String(d)
                        ? 'bg-navy-900 text-white border-navy-900'
                        : 'bg-white text-slate-700 border-slate-200 hover:border-gold-400'
                    }">
                    ${d === 'ALL' ? 'Full Year' : `Next ${d} Days`}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200 mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Filter by Section</label>
                <select onchange="PublicApp.upcomingSection=this.value; App.render();" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                  <option value="ALL">All Railway Board Sections</option>
                  ${Store.data.sections.filter(s => s.isActive).map(s => `<option value="${s.id}" ${String(this.upcomingSection)===String(s.id)?'selected':''}>${Utils.escapeHtml(s.code)} – ${Utils.escapeHtml(s.name)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Filter by Month</label>
                <select onchange="PublicApp.upcomingMonth=this.value; App.render();" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                  <option value="ALL">All Months</option>
                  ${MONTHS.map((m, idx) => `<option value="${idx+1}" ${String(this.upcomingMonth)===String(idx+1)?'selected':''}>${m}</option>`).join('')}
                </select>
              </div>
            </div>

            ${list.length ? `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                ${list.map(emp => `
                  <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div class="flex items-center gap-4">
                      <img src="${Utils.escapeHtml(emp.photo || Utils.avatarUrl(emp.fullName))}" onerror="this.src='${Utils.avatarUrl(emp.fullName)}'"
                        class="w-16 h-16 rounded-2xl object-cover ring-2 ring-gold-300 shrink-0" alt="${Utils.escapeHtml(emp.fullName)}" />
                      <div class="min-w-0">
                        <h3 class="font-bold text-navy-900 text-base truncate">${Utils.escapeHtml(emp.fullName)}</h3>
                        <p class="text-xs text-slate-600 truncate">${Utils.escapeHtml(emp.designation)}</p>
                        <p class="text-xs font-semibold text-gold-700 mt-0.5 truncate">${Utils.escapeHtml(Store.sectionName(emp.sectionId))} • ${Utils.escapeHtml(emp.directorate || Store.sectionDirectorate(emp.sectionId))}</p>
                      </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                      <span class="font-bold text-navy-900"><i class="fa-solid fa-cake-candles text-gold-500 mr-1.5"></i>${emp.nextDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'long' })}</span>
                      <span class="px-3 py-1 rounded-full bg-gold-100 text-gold-700 font-bold">In ${emp.daysLeft} day${emp.daysLeft === 1 ? '' : 's'}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `<div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-500">No upcoming birthdays match the selected filters.</div>`}
          </div>
        `;
      },

      renderCalendar() {
        const y = this.calYear, m = this.calMonth;
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const monthEmps = Store.data.employees.filter(e => {
          if (!e.isActive || !e.dob) return false;
          const b = Engine.getBirthdayInYear(e.dob, y);
          return b && b.getMonth() === m;
        });

        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push(`<div class="min-h-[86px] bg-slate-50/70 rounded-xl border border-slate-100"></div>`);
        for (let day = 1; day <= daysInMonth; day++) {
          const dayEmps = monthEmps.filter(e => Engine.getBirthdayInYear(e.dob, y).getDate() === day);
          const isToday = (y === new Date().getFullYear() && m === new Date().getMonth() && day === new Date().getDate());
          cells.push(`
            <button type="button" onclick="PublicApp.openCalendarDay(${day})"
              class="min-h-[86px] p-2 rounded-xl border text-left transition flex flex-col justify-between ${
                dayEmps.length
                  ? 'bg-gradient-to-br from-gold-50 to-blush border-gold-400 hover:shadow-md'
                  : 'bg-white border-slate-200 hover:border-navy-300'
              } ${isToday ? 'ring-2 ring-navy-900' : ''}">
              <div class="flex items-center justify-between w-full">
                <span class="text-xs font-bold ${isToday ? 'px-2 py-0.5 rounded-full bg-navy-900 text-white' : 'text-slate-700'}">${day}</span>
                ${dayEmps.length ? `<span class="text-[11px] font-bold text-gold-700"><i class="fa-solid fa-cake-candles"></i> ${dayEmps.length}</span>` : ''}
              </div>
              <div class="mt-1 space-y-1 w-full">
                ${dayEmps.slice(0, 2).map(e => `
                  <div class="text-[10px] font-semibold bg-navy-900 text-white px-1.5 py-0.5 rounded truncate">${Utils.escapeHtml(e.fullName)}</div>
                `).join('')}
                ${dayEmps.length > 2 ? `<div class="text-[10px] font-bold text-gold-700">+${dayEmps.length - 2} more</div>` : ''}
              </div>
            </button>
          `);
        }

        return `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
              <div>
                <span class="text-xs font-bold uppercase tracking-widest text-gold-600">Month-Wise View</span>
                <h1 class="font-serif text-3xl font-bold text-navy-900 mt-1">Monthly Birthday Calendar</h1>
              </div>
              <div class="flex items-center gap-2 bg-white px-3 py-2 rounded-2xl border border-slate-200 shadow-xs">
                <button onclick="PublicApp.shiftCalMonth(-1)" class="p-2 rounded-xl hover:bg-slate-100 text-navy-900" aria-label="Previous Month"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="font-serif font-bold text-base sm:text-lg text-navy-900 px-3 min-w-[165px] text-center">${MONTHS[m]} ${y}</span>
                <button onclick="PublicApp.shiftCalMonth(1)" class="p-2 rounded-xl hover:bg-slate-100 text-navy-900" aria-label="Next Month"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>

            <div class="bg-white p-3 sm:p-5 rounded-3xl border border-slate-200 shadow-sm">
              <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-bold uppercase tracking-wider text-navy-800">
                ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="py-2">${d}</div>`).join('')}
              </div>
              <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
                ${cells.join('')}
              </div>
            </div>
          </div>
        `;
      },

      shiftCalMonth(delta) {
        this.calMonth += delta;
        if (this.calMonth < 0) { this.calMonth = 11; this.calYear--; }
        if (this.calMonth > 11) { this.calMonth = 0; this.calYear++; }
        App.render();
      },

      openCalendarDay(day) {
        const y = this.calYear, m = this.calMonth;
        const emps = Store.data.employees.filter(e => {
          if (!e.isActive || !e.dob) return false;
          const b = Engine.getBirthdayInYear(e.dob, y);
          return b && b.getMonth() === m && b.getDate() === day;
        });
        const label = `${day} ${MONTHS[m]} ${y}`;
        if (!emps.length) {
          Modal.open(`Birthdays on ${label}`, `<p class="text-sm text-slate-600 text-center py-6">No employee birthdays recorded on ${label}.</p>`, 'max-w-md');
          return;
        }
        Modal.open(`Birthday Stars – ${label}`, `
          <div class="space-y-3">
            ${emps.map(e => `
              <div class="flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-gold-50 border border-gold-200">
                <div class="flex items-center gap-3">
                  <img src="${Utils.escapeHtml(e.photo || Utils.avatarUrl(e.fullName))}" class="w-12 h-12 rounded-xl object-cover" />
                  <div>
                    <div class="font-bold text-navy-900 text-sm">${Utils.escapeHtml(e.fullName)}</div>
                    <div class="text-xs text-slate-600">${Utils.escapeHtml(e.designation)} • ${Utils.escapeHtml(Store.sectionName(e.sectionId))} (${Utils.escapeHtml(e.directorate || Store.sectionDirectorate(e.sectionId))})</div>
                  </div>
                </div>
                <button onclick="Modal.close(); PublicApp.openWishModal(${e.id});" class="px-3 py-1.5 rounded-xl bg-navy-900 text-white text-xs font-semibold">Send Wish</button>
              </div>
            `).join('')}
          </div>
        `, 'max-w-lg');
      },

      renderWishes() {
        const approved = Store.data.wishes.filter(w => w.status === 'Approved');
        return `
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="flex flex-wrap items-end justify-between gap-4 mb-8">

        const emp = photo.employeeId ? Store.employeeById(photo.employeeId) : null;

        const designation = photo.designation || (emp ? `${emp.designation} • ${Store.sectionName(emp.sectionId)}` : 'Railway Board');

        document.getElementById('lightbox-title').textContent = album.title;
        document.getElementById('lightbox-date').textContent = Utils.formatDate(album.eventDate);
        document.getElementById('lightbox-img').src = photo.url;
        document.getElementById('lightbox-star').textContent = starName;
        document.getElementById('lightbox-desig').textContent = designation;

        let content = '';
        switch (this.route) {
          case 'today': content = this.renderToday(); break;
          case 'upcoming': content = this.renderUpcoming(); break;
          case 'calendar': content = this.renderCalendar(); break;
          case 'wishes': content = this.renderWishes(); break;
          case 'messages': content = this.renderMessages(); break;
          case 'stories': content = this.renderStories(); break;
          case 'gallery': content = this.renderGallery(); break;

      initDashboardCharts() {
        if (!window.Chart) return;
        Object.values(this.charts).forEach(c => c?.destroy());
        this.charts = {};

        const activeSecs = Store.data.sections.filter(s => s.isActive);
        const secLabels = activeSecs.length ? activeSecs.map(s => `${s.code} (${s.directorate || 'Dte.'})`) : ['No Sections Yet'];
        const secContribs = activeSecs.length ? activeSecs.map(s =>
          Store.data.contributions.filter(c => c.status === 'Active' && c.sectionIdSnapshot === s.id).reduce((sum, c) => sum + Number(c.amountReceived), 0)
        ) : [0];
        const secStrength = activeSecs.length ? activeSecs.map(s =>
          Store.data.employees.filter(e => e.isActive && e.sectionId === s.id).length
        ) : [0];

        const monthCol = MONTHS.map((_, idx) =>
          Store.data.contributions.filter(c => c.status === 'Active' && c.month === idx + 1).reduce((s, c) => s + Number(c.amountReceived), 0)
        );
        const monthExp = MONTHS.map((_, idx) =>
          Store.data.purchases.filter(p => p.status === 'Active' && Number(p.purchaseDate.split('-')[1]) === idx + 1).reduce((s, p) => s + Number(p.totalAmount), 0)
        );
        const monthBdays = MONTHS.map((_, idx) =>
          Store.data.employees.filter(e => e.isActive && e.dob && Number(e.dob.split('-')[1]) === idx + 1).length
        );

        const c1 = document.getElementById('chart-sec-contrib');
        if (c1) this.charts.c1 = new Chart(c1, {
          type: 'bar',
          data: { labels: secLabels, datasets: [{ label: 'Received (₹)', data: secContribs, backgroundColor: '#0B2545', borderRadius: 6 }] },
          options: { responsive: true, maintainAspectRatio: false }
        });

        const c2 = document.getElementById('chart-col-exp');
        if (c2) this.charts.c2 = new Chart(c2, {
          type: 'bar',
          data: {
            labels: MONTHS.map(m => m.slice(0, 3)),
            datasets: [
              { label: 'Collections (₹)', data: monthCol, backgroundColor: '#198754', borderRadius: 4 },
              { label: 'Expenditure (₹)', data: monthExp, backgroundColor: '#C9A227', borderRadius: 4 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });

        const c3 = document.getElementById('chart-bday-dist');
        if (c3) this.charts.c3 = new Chart(c3, {
          type: 'line',
          data: { labels: MONTHS.map(m => m.slice(0, 3)), datasets: [{ label: 'Birthdays', data: monthBdays, borderColor: '#C9A227', backgroundColor: 'rgba(201,162,39,0.2)', fill: true, tension: 0.35 }] },
          options: { responsive: true, maintainAspectRatio: false }
        });

        const c4 = document.getElementById('chart-sec-strength');
        if (c4) this.charts.c4 = new Chart(c4, {
          type: 'doughnut',
          data: { labels: secLabels, datasets: [{ data: secStrength, backgroundColor: ['#0B2545', '#C9A227', '#1d4ed8', '#0d9488', '#7c3aed', '#d97706'] }] },
          options: { responsive: true, maintainAspectRatio: false }
        });
      },

              </table>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

              <div><label class="block text-xs font-bold mb-1">Section In-Charge / Nodal Officer</label><input id="sf-inc" value="${Utils.escapeHtml(s?.inCharge || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>

      saveSection(e, id) {
        e.preventDefault();
        const code = document.getElementById('sf-code').value.trim();
        const name = document.getElementById('sf-name').value.trim();
        const directorate = document.getElementById('sf-dte').value.trim();
        const inCharge = document.getElementById('sf-inc').value.trim();
        const remarks = document.getElementById('sf-rem').value.trim();

        if (id) {
          const s = Store.sectionById(id);
          Object.assign(s, { code, name, directorate, inCharge, remarks });
          Store.logAudit('Section', 'Update', `Updated section ${code} (${name} – ${directorate})`);
        } else {
          Store.data.sections.push({ id: Utils.nextId(Store.data.sections), code, name, directorate, inCharge, remarks, isActive: true });
          Store.logAudit('Section', 'Create', `Created section ${code} (${name} – ${directorate})`);
        }
        Store.save();
        Modal.close();
        Toast.show('Section & Directorate saved.', 'success');
        this.navigate('sections');
      },

      toggleSection(id) {
        const s = Store.sectionById(id);
        s.isActive = !s.isActive;
        Store.save();
        Store.logAudit('Section', s.isActive ? 'Activate' : 'Deactivate', `Section ${s.code} marked ${s.isActive ? 'Active' : 'Inactive'}.`);
        Toast.show(`Section ${s.code} ${s.isActive ? 'activated' : 'deactivated'}.`, 'info');
        this.navigate('sections');
      },

                <p class="text-xs text-slate-500">Add individual members, manually feed bulk rows, or upload a PDF list to extract & finalise birthdays.</p>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="Exporter.exportEmployees()" class="px-3.5 py-2.5 rounded-xl bg-white border border-slate-300 text-navy-900 text-xs font-bold hover:bg-slate-50">

                </button>
                <button onclick="AdminApp.openMemberPdfModal()" class="px-3.5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold shadow-xs">

                </button>
                <button onclick="AdminApp.openManualBulkMembersModal()" class="px-3.5 py-2.5 rounded-xl bg-white border border-navy-800 text-navy-900 text-xs font-bold hover:bg-navy-50">
                  <i class="fa-solid fa-table-list mr-1.5 text-gold-600"></i>Manual Feed Birthday List
                </button>
                <button onclick="AdminApp.openEmployeeForm()" class="px-4 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">
                  <i class="fa-solid fa-user-plus mr-1.5 text-gold-400"></i>Add Member
                </button>
              </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-200 grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input value="${Utils.escapeHtml(this.empSearch)}" oninput="AdminApp.empSearch=this.value; App.render();" placeholder="Search Name, Employee ID, Designation or Dte..." class="sm:col-span-2 px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
              <select onchange="AdminApp.empSectionFilter=this.value; App.render();" class="px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                <option value="ALL">All Sections</option>
                ${Store.data.sections.map(s => `<option value="${s.id}" ${String(this.empSectionFilter)===String(s.id)?'selected':''}>${Utils.escapeHtml(s.code)} – ${Utils.escapeHtml(s.name)}</option>`).join('')}
              </select>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-xs">
              <table class="w-full text-left text-xs">
                <thead class="bg-navy-900 text-white">
                  <tr>
                    <th class="px-4 py-3">Member</th>
                    <th class="px-4 py-3">Designation</th>
                    <th class="px-4 py-3">Section</th>
                    <th class="px-4 py-3">Directorate (Dte.)</th>
                    <th class="px-4 py-3">Date of Birth</th>
                    <th class="px-4 py-3 text-center">Status</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${list.length ? list.map(e => `
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3">
                        <div class="flex items-center gap-2.5">
                          <img src="${Utils.escapeHtml(e.photo || Utils.avatarUrl(e.fullName))}" class="w-8 h-8 rounded-full object-cover" />
                          <div>
                            <div class="font-bold text-navy-900">${Utils.escapeHtml(e.fullName)}</div>
                            <div class="text-[11px] text-slate-400">${Utils.escapeHtml(e.empCode || 'No ID')}</div>
                          </div>
                        </div>
                      </td>
                      <td class="px-4 py-3">${Utils.escapeHtml(e.designation)}</td>
                      <td class="px-4 py-3 font-semibold text-navy-800">${Utils.escapeHtml(Store.sectionName(e.sectionId))}</td>
                      <td class="px-4 py-3 font-medium text-gold-700">${Utils.escapeHtml(e.directorate || Store.sectionDirectorate(e.sectionId))}</td>
                      <td class="px-4 py-3 font-semibold text-navy-900">${Utils.formatDate(e.dob)}</td>
                      <td class="px-4 py-3 text-center">
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${e.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">${e.isActive ? 'Active' : 'Inactive'}</span>

            </div>

      openEmployeeForm(id = null) {
        const e = id ? Store.employeeById(id) : null;
        const activeSecs = Store.data.sections.filter(s => s.isActive);
        Modal.open(e ? 'Edit Birthday Member' : 'Add New Birthday Member', `
          <form onsubmit="AdminApp.saveEmployee(event, ${id || 'null'})" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label class="block text-xs font-bold mb-1">Full Name *</label><input id="ef-name" required value="${Utils.escapeHtml(e?.fullName || '')}" placeholder="e.g. Shri R. K. Verma" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div><label class="block text-xs font-bold mb-1">Designation *</label><input id="ef-desig" required value="${Utils.escapeHtml(e?.designation || '')}" placeholder="e.g. Section Officer" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div>
                <label class="block text-xs font-bold mb-1">Section *</label>
                ${activeSecs.length
                  ? `<select id="ef-sec" onchange="AdminApp.syncEmpDteFromSec(this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">${activeSecs.map(s => `<option value="${s.id}" ${Number(e?.sectionId) === s.id ? 'selected' : ''}>${Utils.escapeHtml(s.code)} – ${Utils.escapeHtml(s.name)}</option>`).join('')}</select>`

              </div>
              <div><label class="block text-xs font-bold mb-1">Directorate (Dte.) *</label><input id="ef-dte" required value="${Utils.escapeHtml(e?.directorate || (activeSecs[0] ? Store.sectionDirectorate(e?.sectionId || activeSecs[0]?.id) : ''))}" placeholder="e.g. Establishment Dte." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div><label class="block text-xs font-bold mb-1">Date of Birth *</label><input id="ef-dob" type="date" required value="${Utils.escapeHtml(e?.dob || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div><label class="block text-xs font-bold mb-1">Employee ID (Optional)</label><input id="ef-code" value="${Utils.escapeHtml(e?.empCode || '')}" placeholder="e.g. RB202601" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div class="sm:col-span-2"><label class="block text-xs font-bold mb-1">Email (Optional)</label><input id="ef-email" type="email" value="${Utils.escapeHtml(e?.email || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" /></div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="Modal.close()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">Save Member</button>
            </div>
          </form>
        `, 'max-w-xl');
      },

      syncEmpDteFromSec(secId) {
        const dteInput = document.getElementById('ef-dte');
        if (dteInput && secId) dteInput.value = Store.sectionDirectorate(secId);
      },

      saveEmployee(ev, id) {
        ev.preventDefault();
        const empCode = document.getElementById('ef-code').value.trim();
        if (empCode && Store.data.employees.some(x => x.empCode && x.empCode.toLowerCase() === empCode.toLowerCase() && x.id !== id)) {
          Toast.show('Employee ID must be unique.', 'error');
          return;
        }
        const secSelect = document.getElementById('ef-sec');
        const secTextEl = document.getElementById('ef-sec-text');
        const dteVal = document.getElementById('ef-dte').value.trim() || 'Railway Board Dte.';
        const sectionId = secSelect
          ? Number(secSelect.value)
          : Store.findOrCreateSection(secTextEl?.value.trim() || 'RB-GEN', dteVal);

        const obj = {
          empCode,
          fullName: document.getElementById('ef-name').value.trim(),
          designation: document.getElementById('ef-desig').value.trim(),
          sectionId,
          directorate: dteVal,
          dob: document.getElementById('ef-dob').value,
          email: document.getElementById('ef-email').value.trim()
        };
        if (id) {
          Object.assign(Store.employeeById(id), obj);
          Store.logAudit('Employee', 'Update', `Updated ${obj.fullName} (${obj.directorate})`);
        } else {
          Store.data.employees.push({ id: Utils.nextId(Store.data.employees), ...obj, photo: '', mobile: '', doj: '', isActive: true });
          Store.logAudit('Employee', 'Create', `Added ${obj.fullName} (${obj.directorate})`);
        }
        Store.save();
        Modal.close();
        Toast.show('Member saved & birthday calendar updated.', 'success');
        this.navigate('employees');
      },

      toggleEmployee(id) {
        const e = Store.employeeById(id);
        e.isActive = !e.isActive;
        Store.save();
        Store.logAudit('Employee', e.isActive ? 'Activate' : 'Deactivate', `Member ${e.fullName} marked ${e.isActive ? 'Active' : 'Inactive'}.`);
        Toast.show(`Member status updated.`, 'info');
        this.navigate('employees');
      },

      openManualBulkMembersModal(prefilledRows = null) {
        const rows = prefilledRows && prefilledRows.length ? prefilledRows : [
          { name: '', designation: '', section: Store.data.sections[0]?.code || 'RB-EST', directorate: Store.data.sections[0]?.directorate || 'Establishment Dte.', dob: '' },
          { name: '', designation: '', section: Store.data.sections[0]?.code || 'RB-EST', directorate: Store.data.sections[0]?.directorate || 'Establishment Dte.', dob: '' },
          { name: '', designation: '', section: Store.data.sections[0]?.code || 'RB-EST', directorate: Store.data.sections[0]?.directorate || 'Establishment Dte.', dob: '' }
        ];

        Modal.open('Manual Feed & Finalise Birthday Members List', `
          <form onsubmit="AdminApp.saveManualBulkMembers(event)" class="space-y-4">
            <div class="p-3 rounded-xl bg-gold-50 border border-gold-200 text-xs text-navy-900">
              Feed or edit multiple members below along with their <strong>Section</strong>, <strong>Directorate (Dte.)</strong>, and <strong>Date of Birth</strong>. New sections are created automatically if not already in the master list.
            </div>
            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-navy-900 text-white">
                  <tr>
                    <th class="px-2.5 py-2">Member Name *</th>
                    <th class="px-2.5 py-2">Designation *</th>
                    <th class="px-2.5 py-2">Section *</th>
                    <th class="px-2.5 py-2">Directorate (Dte.) *</th>
                    <th class="px-2.5 py-2">Date of Birth *</th>
                    <th class="px-2 py-2"></th>
                  </tr>
                </thead>
                <tbody id="bulk-members-tbody" class="divide-y divide-slate-100">
                  ${rows.map(r => this.buildBulkMemberRowHtml(r)).join('')}
                </tbody>
              </table>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
              <button type="button" onclick="AdminApp.addBulkMemberRow()" class="px-3.5 py-2 rounded-xl bg-navy-50 text-navy-900 text-xs font-bold hover:bg-navy-100">
                <i class="fa-solid fa-plus mr-1"></i>Add Another Row
              </button>
              <div class="flex gap-2">
                <button type="button" onclick="Modal.close()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">Finalise & Save All Members</button>
              </div>
            </div>
          </form>
        `, 'max-w-4xl');
      },

      buildBulkMemberRowHtml(r = {}) {
        return `
          <tr>
            <td class="p-1.5"><input name="bm_name" value="${Utils.escapeHtml(r.name || '')}" placeholder="Full Name" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 text-xs" /></td>
            <td class="p-1.5"><input name="bm_desig" value="${Utils.escapeHtml(r.designation || '')}" placeholder="Designation" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 text-xs" /></td>
            <td class="p-1.5"><input name="bm_sec" value="${Utils.escapeHtml(r.section || '')}" placeholder="Section" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 text-xs" /></td>
            <td class="p-1.5"><input name="bm_dte" value="${Utils.escapeHtml(r.directorate || '')}" placeholder="Directorate (Dte.)" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 text-xs" /></td>
            <td class="p-1.5"><input name="bm_dob" type="date" value="${Utils.escapeHtml(r.dob || '')}" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 text-xs" /></td>
            <td class="p-1.5 text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-rose-600 hover:text-rose-800 px-1"><i class="fa-solid fa-trash-can"></i></button></td>
          </tr>
        `;
      },

      addBulkMemberRow() {
        const tbody = document.getElementById('bulk-members-tbody');
        if (tbody) tbody.insertAdjacentHTML('beforeend', this.buildBulkMemberRowHtml({
          section: Store.data.sections[0]?.code || 'RB-EST',
          directorate: Store.data.sections[0]?.directorate || 'Establishment Dte.'
        }));
      },

      saveManualBulkMembers(e) {
        e.preventDefault();
        const trs = Array.from(document.querySelectorAll('#bulk-members-tbody tr'));
        let added = 0;
        trs.forEach(tr => {
          const name = tr.querySelector('[name="bm_name"]').value.trim();
          const desig = tr.querySelector('[name="bm_desig"]').value.trim() || 'Staff / Officer';
          const sec = tr.querySelector('[name="bm_sec"]').value.trim() || 'RB-GEN';
          const dte = tr.querySelector('[name="bm_dte"]').value.trim() || 'Railway Board Dte.';
          const dob = tr.querySelector('[name="bm_dob"]').value;
          if (!name || !dob) return;

          const sectionId = Store.findOrCreateSection(sec, dte);
          Store.data.employees.push({
            id: Utils.nextId(Store.data.employees),
            empCode: '',
            fullName: name,
            designation: desig,
            sectionId,
            directorate: dte,
            dob,
            photo: '',
            mobile: '',
            email: '',
            doj: '',
            isActive: true
          });
          added++;
        });
        if (!added) {
          Toast.show('Please enter at least one member with Name and Date of Birth.', 'error');
          return;
        }
        Store.save();
        Store.logAudit('Employee', 'Manual Bulk Feed', `Finalised and added ${added} birthday members.`);
        Modal.close();
        Toast.show(`Finalised ${added} member(s) into the Birthday List!`, 'success');
        this.navigate('employees');
      },

      openMemberPdfModal() {
        Modal.open('Upload Direct PDF – Extract Birthday Members List', `
          <div class="space-y-4">
            <div class="p-3.5 rounded-xl bg-skysoft text-navy-900 text-xs leading-relaxed">
              Upload any Railway Board PDF containing member names, designations, sections, directorates (Dte.), and dates of birth. The system will extract the records automatically so you can verify and finalise them.
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Select PDF Document (.pdf) *</label>
              <input type="file" id="member-pdf-file" accept=".pdf,application/pdf" onchange="AdminApp.processMemberPdf(this)"
                class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white" />
            </div>
            <div id="member-pdf-status" class="text-xs text-slate-500"></div>
            <div id="member-pdf-raw-wrap" class="hidden">
              <label class="block text-xs font-bold text-slate-700 mb-1">Extracted PDF Text Preview</label>
              <textarea id="member-pdf-raw" rows="5" readonly class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-[11px] font-mono"></textarea>
            </div>
          </div>
        `, 'max-w-xl');
      },

      async processMemberPdf(input) {
        const file = input.files?.[0];
        if (!file) return;
        const statusEl = document.getElementById('member-pdf-status');
        statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5 text-navy-800"></i>Reading and extracting data from <strong>${Utils.escapeHtml(file.name)}</strong>...`;
        try {
          const lines = await PdfExtractor.extractFromFile(file);
          document.getElementById('member-pdf-raw-wrap').classList.remove('hidden');
          document.getElementById('member-pdf-raw').value = lines.join('\n');
          const extracted = PdfExtractor.parseMemberRows(lines);
          Store.logAudit('PDF Extract', 'Members PDF', `Extracted ${extracted.length} candidate member rows from ${file.name}.`);
          Toast.show(`Extracted ${extracted.length} row(s) from PDF. Review & finalise below.`, 'success');
          this.openManualBulkMembersModal(extracted.length ? extracted : [{ name: '', designation: '', section: '', directorate: '', dob: '' }]);
        } catch (err) {
          statusEl.innerHTML = `<span class="text-rose-700 font-semibold">${Utils.escapeHtml(err.message || 'Could not parse PDF.')}</span>`;
        }
      },

      /* 6.3 BIRTHDAY EVENTS */
      renderEvents() {
        return `
          <div class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="font-serif text-2xl font-bold text-navy-900">Birthday Event Management</h1>
                <p class="text-xs text-slate-500">Track individual & combined celebrations, expenditure, and event surplus/deficit.</p>

              <button onclick="AdminApp.openEventForm()" class="px-4 py-2.5 rounded-xl bg-navy-900 text-white text-xs font-bold">

              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              ${Store.data.events.length ? Store.data.events.map(ev => {
                const spent = Store.data.purchases.filter(p => p.status === 'Active' && p.eventId === ev.id).reduce((s, p) => s + Number(p.totalAmount), 0);
                const bal = Number(ev.allocatedBudget || 0) - spent;
                return `
                  <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs space-y-3">
                    <div class="flex items-start justify-between gap-2">

      saveRate(e) {
        e.preventDefault();
        const amount = Number(document.getElementById('rf-amt').value);
        const effectiveFrom = document.getElementById('rf-from').value;
        const remarks = document.getElementById('rf-rem').value.trim();

        Store.data.contributionRates.forEach(r => {
          if (!r.effectiveTo && r.effectiveFrom < effectiveFrom) {
            const d = new Date(effectiveFrom + 'T00:00:00');
            d.setDate(d.getDate() - 1);
            r.effectiveTo = d.toISOString().slice(0, 10);
          }
        });

        const user = Auth.currentUser();
        Store.data.contributionRates.push({
          id: Utils.nextId(Store.data.contributionRates),
          amount,
          effectiveFrom,
          effectiveTo: '',
          isActive: true,
          remarks,
          updatedBy: user?.fullName || 'Admin',
          updatedDate: Utils.todayIso()
        });
        Store.save();
        Store.logAudit('ContributionRate', 'Create', `Configured ₹${amount} effective from ${effectiveFrom}.`);
        Modal.close();
        Toast.show(`Contribution rate ₹${amount} scheduled from ${Utils.formatDate(effectiveFrom)}.`, 'success');
        this.navigate('rates');

      saveContribution(e) {
        e.preventDefault();
        const empVal = document.getElementById('cf-emp').value;
        const empId = empVal ? Number(empVal) : null;
        const contributorName = document.getElementById('cf-name').value.trim();
        const secSelect = document.getElementById('cf-sec');
        const secTextEl = document.getElementById('cf-sec-text');
        const directorate = document.getElementById('cf-dte').value.trim() || 'Railway Board Dte.';
        const sectionIdSnapshot = secSelect
          ? Number(secSelect.value)
          : Store.findOrCreateSection(secTextEl?.value.trim() || 'RB-GEN', directorate);

        const month = Number(document.getElementById('cf-mon').value);
        const year = Number(document.getElementById('cf-yr').value);
        const amountReceived = Number(document.getElementById('cf-amt').value);
        const paymentMode = document.getElementById('cf-mode').value;
        const receiptDate = document.getElementById('cf-date').value;
        const reference = document.getElementById('cf-ref').value.trim();

        if (reference && Store.data.contributions.some(c => c.status === 'Active' && c.paymentMode === paymentMode && c.reference === reference)) {
          Toast.show('Duplicate transaction reference detected for this payment mode.', 'error');
          return;
        }

        Store.data.contributions.unshift({
          id: Utils.nextId(Store.data.contributions),
          financialYear: Utils.getFY(year, month),
          year,
          month,
          employeeId: empId,
          employeeNameSnapshot: contributorName,
          sectionIdSnapshot,
          directorateSnapshot: directorate,
          amountReceived,
          receiptDate,
          paymentMode,
          reference,
          status: 'Active'
        });
        Store.save();
        Store.logAudit('Contribution', 'Create', `Recorded ₹${amountReceived} from ${contributorName} (${directorate}) via ${paymentMode}.`);
        Modal.close();
        Toast.show('Contributor receipt recorded!', 'success');
        this.navigate('collections');
      },
